<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GEODOS OSINT & GEOINT SUITE PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #030712; color: #22d3ee; font-family: monospace; }
        .panel-tactico { border: 1px solid rgba(34, 211, 238, 0.3); background: rgba(0, 0, 0, 0.85); box-shadow: 0 0 15px rgba(34, 211, 238, 0.1); }
        .btn-comando { border: 1px solid #0891b2; background: #0b0f19; color: #67e8f9; transition: all 0.2s; }
        .btn-comando:hover, .btn-comando.active { background: #0891b2; color: #000; box-shadow: 0 0 10px #22d3ee; font-weight: bold; }
    </style>
</head>
<body class="p-4 max-w-xl mx-auto pb-16">

    <!-- ENCABEZADO -->
    <div class="panel-tactico p-3 mb-4 flex justify-between items-center">
        <div>
            <h1 class="text-sm font-bold tracking-wider">GEODOS OSINT SUITE PRO</h1>
            <p class="text-xs text-gray-400">OPERADOR: <span class="text-cyan-400">CERVANDO</span> | ID: <span class="text-cyan-400">6482757502</span></p>
        </div>
        <div class="text-right">
            <span class="inline-block w-2 h-2 rounded-full bg-green-500 animate-ping"></span>
            <span class="text-xs text-green-400 ml-1">ONLINE</span>
        </div>
    </div>

    <!-- PANEL DE HISTORIAL (OCULTO) -->
    <div id="panelHistorial" class="panel-tactico p-3 mb-4 hidden">
        <h3 class="text-xs font-bold text-cyan-300 mb-2 border-b border-cyan-800 pb-1">◇ HISTORIAL DE CONSULTAS ANTERIORES</h3>
        <div id="listaHistorial" class="text-xs space-y-1 max-h-40 overflow-y-auto text-gray-300">
            <p class="text-gray-500">Sin consultas registradas.</p>
        </div>
    </div>

    <!-- SELECTORES DE COMANDOS / CELDAS -->
    <div class="grid grid-cols-3 gap-2 mb-3">
        <button onclick="setModo('telcel', this)" class="btn-comando active p-2 text-xs">📱 Telcel / Celda</button>
        <button onclick="setModo('ine', this)" class="btn-comando p-2 text-xs">📁 Padrón (24GB)</button>
        <button onclick="setModo('osint', this)" class="btn-comando p-2 text-xs">🔍 OSINT Web</button>
        <button onclick="setModo('covid', this)" class="btn-comando p-2 text-xs">🏥 Base COVID</button>
        <button onclick="setModo('financial', this)" class="btn-comando p-2 text-xs">💳 Financiero</button>
        <button onclick="setModo('ocr', this)" class="btn-comando p-2 text-xs">👁️ OCR Visión</button>
        <button onclick="setModo('facial', this)" class="btn-comando p-2 text-xs col-span-3">👤 Búsqueda por Rostro</button>
    </div>

    <!-- ENTRADA DE DATOS -->
    <div class="panel-tactico p-3 mb-4">
        <div id="inputTextoContainer">
            <input type="text" id="searchInput" placeholder="Ingresa objetivo (Teléfono, Nombre, CURP)..." class="w-full bg-black border border-cyan-800 p-2 text-xs text-cyan-300 mb-2 focus:outline-none focus:border-cyan-400">
        </div>
        
        <div id="inputArchivoContainer" class="hidden mb-2">
            <input type="file" id="fileInput" accept="image/*,.pdf,.doc" class="w-full text-xs text-gray-400 border border-cyan-800 p-1 bg-black">
        </div>

        <button onclick="ejecutarAnalisis()" class="w-full bg-cyan-500 text-black font-bold py-2 text-xs tracking-widest hover:bg-cyan-400 transition">
            EJECUTAR ANÁLISIS TÁCTICO →
        </button>
    </div>

    <!-- RESULTADO TÁCTICO -->
    <div class="panel-tactico p-4">
        <h3 class="text-xs font-bold text-gray-400 mb-2">Resultado del Sistema Táctico</h3>
        <div id="resultadoTactico" class="text-xs text-cyan-300 whitespace-pre-wrap font-mono min-h-[140px]">
            [ Sistema listo para procesar objetivos... ]
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <div class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-cyan-900 p-2 flex justify-around text-xs max-w-xl mx-auto">
        <button onclick="location.reload()" class="text-cyan-400 font-bold">🔍 Búsqueda</button>
        <button onclick="toggleHistorial()" class="text-gray-400 hover:text-cyan-400">📁 Historial</button>
        <button onclick="alert('Rango actual: Usuario Free / Créditos: 3')" class="text-gray-400 hover:text-cyan-400">💎 Tienda VIP</button>
        <button onclick="alert('Operador: Cervando\nID: 6482757502\nNivel: Autorizado')" class="text-gray-400 hover:text-cyan-400">👤 Mi Cuenta</button>
    </div>

    <script>
        let modoActual = 'telcel';
        const userId = 6482757502;

        function setModo(modo, btn) {
            modoActual = modo;
            document.querySelectorAll('.btn-comando').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(modo === 'ocr' || modo === 'facial') {
                document.getElementById('inputTextoContainer').classList.add('hidden');
                document.getElementById('inputArchivoContainer').classList.remove('hidden');
            } else {
                document.getElementById('inputTextoContainer').classList.remove('hidden');
                document.getElementById('inputArchivoContainer').classList.add('hidden');
            }
        }

        async function ejecutarAnalisis() {
            const resultadoBox = document.getElementById('resultadoTactico');

            // Suspenso por Fases en tiempo real
            resultadoBox.innerHTML = `⚡ [ESTABLECIendo ENLACE CON NODO SEGURO]...\n█▒▒▒▒▒▒▒▒▒ 15% - Verificando parámetros...`;
            await new Promise(r => setTimeout(r, 400));
            resultadoBox.innerHTML = `⚡ [CRUZANDO BASES DE DATOS]...\n██████▒▒▒▒ 65% - Extrayendo metadatos y geolocalización...`;
            await new Promise(r => setTimeout(r, 500));

            try {
                if (modoActual === 'ocr' || modoActual === 'facial') {
                    const fileInput = document.getElementById('fileInput');
                    if(fileInput.files.length === 0) {
                        alert("Sube un archivo o fotografía válida.");
                        return;
                    }
                    const formData = new FormData();
                    formData.append("file", fileInput.files[0]);
                    const endpoint = modoActual === 'ocr' ? '/api/ocr' : '/api/facial';

                    const res = await fetch(endpoint, { method: 'POST', body: formData });
                    const data = await res.json();
                    resultadoBox.innerHTML = `<div class="p-2 border border-cyan-500 bg-black">${data.detalles}</div>`;
                } else {
                    const query = document.getElementById('searchInput').value;
                    if(!query) {
                        alert("Ingresa un objetivo de búsqueda válido.");
                        resultadoBox.innerHTML = "[!] Error: Campo vacío.";
                        return;
                    }

                    const res = await fetch('/api/buscar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: userId, query: query, type: modoActual })
                    });
                    const data = await res.json();

                    let html = "";
                    data.data.forEach(item => {
                        html += `<div class="p-2 mb-2 border border-cyan-800 bg-black/90">${item.detalles}</div>`;
                    });
                    resultadoBox.innerHTML = html;
                }
            } catch (err) {
                resultadoBox.innerHTML = `⚠️ Error crítico conectando con el servidor de inteligencia.`;
            }
        }

        async function toggleHistorial() {
            const panel = document.getElementById('panelHistorial');
            panel.classList.toggle('hidden');
            if(!panel.classList.contains('hidden')) {
                const res = await fetch(`/api/historial/${userId}`);
                const data = await res.json();
                const lista = document.getElementById('listaHistorial');
                if(data.historial && data.historial.length > 0) {
                    lista.innerHTML = data.historial.map(h => `<div class="border-b border-gray-800 py-1">🔹 [${h.modo}] <b>${h.query}</b></div>`).join('');
                } else {
                    lista.innerHTML = `<p class="text-gray-500">Sin consultas registradas.</p>`;
                }
            }
        }
    </script>
</body>
</html>
